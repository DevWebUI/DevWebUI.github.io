schema: hydra-rsi/1
# Bytes a visitor can download from the static site (committed size at HEAD of served files).
# Smaller pages and images load faster, which matters for a landing page.
metrics:
  - id: site.shipped_bytes
    kind: size
    better: lower
    unit: bytes
    measure: "python scripts/rsi/shipped_bytes.py"
    pick: 'shipped_bytes=(\d+)'
    gate: exact
    light: true
